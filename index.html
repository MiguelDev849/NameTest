<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nomes por Ano</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{
    width:700px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;

    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    font-size:16px;

    box-sizing:border-box;
}

button{
    width:100%;

    margin-top:10px;
    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    font-size:16px;
    cursor:pointer;
}

#resultado{

    margin-top:20px;

    background:#181818;

    border-radius:10px;
    padding:15px;

    max-height:500px;
    overflow-y:auto;
}

.nome{

    padding:10px;

    border-bottom:1px solid #333;
}

.info{
    color:#aaa;
    font-size:14px;
}

</style>

</head>
<body>

<div class="box">

    <h1>Nomes Populares</h1>

    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscarNomes()">
        Buscar nomes
    </button>

    <div id="resultado">

        Digite um ano.

    </div>

</div>

<script>

// BANCO GIGANTE DE NOMES
const banco = {

1980: [

"Carlos","Ricardo","Marcos","Roberto","José",
"Paulo","Fernando","Márcio","André","Cláudio",
"Patrícia","Fernanda","Juliana","Márcia","Cristiane",
"Luciana","Sandra","Carla","Vanessa","Adriana"

],

1990: [

"Lucas","Gabriel","Felipe","Rafael","Bruno",
"Thiago","Matheus","Gustavo","Daniel","Diego",
"Amanda","Camila","Larissa","Natália","Vanessa",
"Mariana","Beatriz","Juliana","Carolina","Bianca"

],

2000: [

"Miguel","Arthur","Pedro","João","Gabriel",
"Matheus","Lucas","Gustavo","Enzo","Felipe",
"Sophia","Julia","Yasmin","Larissa","Maria Eduarda",
"Beatriz","Ana Clara","Giovanna","Isabella","Alice"

],

2010: [

"Theo","Gael","Davi","Noah","Samuel",
"Benjamin","Heitor","Arthur","Miguel","Ravi",
"Helena","Alice","Valentina","Laura","Liz",
"Maitê","Sophia","Heloísa","Cecília","Aurora"

],

2020: [

"Miguel","Gael","Theo","Heitor","Arthur",
"Ravi","Noah","Davi","Bernardo","Samuel",
"Helena","Alice","Laura","Maria Alice","Valentina",
"Heloísa","Sophia","Cecília","Liz","Aurora"

]

};

function buscarNomes(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    // descobrir década
    const decada =
        Math.floor(ano / 10) * 10;

    const nomes =
        banco[decada];

    if(!nomes){

        resultado.innerHTML =
            "Década não encontrada.";

        return;
    }

    let html = `

        <h2>
            Década de ${decada}
        </h2>

        <p>
            ${nomes.length} nomes encontrados
        </p>

    `;

    nomes.forEach((nome, index) => {

        // sexo estimado simples
        let sexo =
            nome.endsWith("a")
            ? "Feminino"
            : "Masculino";

        html += `

            <div class="nome">

                <b>
                    ${index + 1}.
                    ${nome}
                </b>

                <div class="info">

                    Sexo provável:
                    ${sexo}

                </div>

            </div>

        `;

    });

    resultado.innerHTML = html;
}

</script>

</body>
</html>
