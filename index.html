async function buscar(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    const decada =
        Math.floor(ano / 10) * 10;

    resultado.innerHTML =
        "Buscando nomes...";

    try{

        // API DO IBGE
        const url =

`https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking?decada=${decada}`;

        const resposta =
            await fetch(url);

        const dados =
            await resposta.json();

        let nomesIBGE = [];

        // pegar nomes da API
        if(
            dados &&
            dados[0] &&
            dados[0].res
        ){

            nomesIBGE =
                dados[0].res.map(
                    x => x.nome
                );
        }

        // juntar listas
        const nomesFinal = [

            ...nomesIBGE,
            ...nomesExtras

        ];

        // remover repetidos
        const semDuplicados = [

            ...new Set(nomesFinal)

        ];

        let html = `

            <h2>
                Década de ${decada}
            </h2>

            <p>
                ${semDuplicados.length}
                nomes encontrados
            </p>

        `;

        semDuplicados.forEach((nome, index) => {

            let sexo =
                nome.endsWith("a")
                ? "Feminino"
                : "Masculino";

            html += `

                <div class="nome">

                    <b>
                        ${index + 1}.
                        ${nome}
                    </b>

                    <div class="info">

                        Sexo provável:
                        ${sexo}

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        // fallback sem API
        let html = `

            <h2>
                Banco local
            </h2>

            <p>
                ${nomesExtras.length}
                nomes encontrados
            </p>

        `;

        nomesExtras.forEach((nome, index) => {

            let sexo =
                nome.endsWith("a")
                ? "Feminino"

                        ${index + 1}.
                        ${nome}
                    </b>

                    <div class="info">

                        Sexo provável:
                        ${sexo}

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;
    }
