<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IBGE Nomes</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    margin:0;
}

.box{
    width:700px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    box-sizing:border-box;
}

button{
    width:100%;

    margin-top:10px;
    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    cursor:pointer;
}

#resultado{
    margin-top:20px;

    background:#181818;

    border-radius:10px;

    padding:15px;

    max-height:500px;
    overflow-y:auto;
}

.nome{
    padding:10px;
    border-bottom:1px solid #333;
}

</style>

</head>
<body>

<div class="box">

    <h1>Nomes do IBGE</h1>

    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <div id="resultado">

        Digite um ano.

    </div>

</div>

<script>

async function buscar(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    const decada =
        Math.floor(ano / 10) * 10;

    resultado.innerHTML =
        "Buscando...";

    try{

        // URL FUNCIONAL
        const url =

`https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking?decada=${decada}`;

        const resposta =
            await fetch(url);

        const dados =
            await resposta.json();

        if(
            !dados ||
            !dados[0] ||
            !dados[0].res
        ){

            resultado.innerHTML =
                "Nenhum resultado.";

            return;
        }

        let html = `

            <h2>
                Década de ${decada}
            </h2>

        `;

        dados[0].res.forEach((item, index) => {

            html += `

                <div class="nome">

                    ${index + 1}.
                    ${item.nome}

                    <br>

                    Frequência:
                    ${item.frequencia.toLocaleString()}

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        resultado.innerHTML =
            "Erro ao buscar dados.";
    }
}

</script>

</body>
</html>
