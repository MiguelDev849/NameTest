<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nomes do IBGE</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{
    width:700px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    box-sizing:border-box;
}

button{
    width:100%;

    margin-top:10px;
    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    cursor:pointer;
}

#resultado{

    margin-top:20px;

    background:#181818;

    border-radius:10px;

    padding:15px;

    max-height:500px;
    overflow-y:auto;
}

.nome{
    padding:10px;
    border-bottom:1px solid #333;
}

.info{
    color:#aaa;
}

</style>

</head>
<body>

<div class="box">

    <h1>Nomes do IBGE</h1>

    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscarNomes()">
        Buscar
    </button>

    <div id="resultado">

        Digite um ano.

    </div>

</div>

<script>

async function buscarNomes(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    const decada =
        Math.floor(ano / 10) * 10;

    const proxima =
        decada + 10;

    resultado.innerHTML =
        "Buscando...";

    try{

        // URL CORRIGIDA
        const url =

`https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking?decada=%5B${decada},${proxima}%5B`;

        const resposta =
            await fetch(url);

        if(!resposta.ok){

            throw new Error(
                "Erro na API"
            );
        }

        const dados =
            await resposta.json();

        if(
            !dados[0] ||
            !dados[0].res
        ){

            resultado.innerHTML =
                "Nenhum resultado.";

            return;
        }

        const nomes =
            dados[0].res;

        let html = `

            <h2>
                Década de ${decada}
            </h2>

            <p>
                ${nomes.length} nomes encontrados
            </p>

        `;

        nomes.forEach((item, index) => {

            html += `

                <div class="nome">

                    <b>
                        ${index + 1}.
                        ${item.nome}
                    </b>

                    <div class="info">

                        Frequência:
                        ${item.frequencia.toLocaleString()}
                        pessoas

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        resultado.innerHTML =

            "Erro ao buscar nomes.";

    }

}

</script>

</body>
</html>
