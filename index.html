<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tabela Completa IBGE</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{
    width:900px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;
}

input{

    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    box-sizing:border-box;
}

button{

    width:100%;
    margin-top:10px;

    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    cursor:pointer;
}

#resultado{

    margin-top:20px;

    background:#181818;

    border-radius:10px;

    padding:15px;

    max-height:600px;
    overflow-y:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border-bottom:1px solid #333;
    padding:10px;
    text-align:left;
}

th{
    position:sticky;
    top:0;
    background:#222;
}

</style>

</head>
<body>

<div class="box">

    <h1>Tabela Completa do IBGE</h1>

    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscarNomes()">
        Buscar nomes
    </button>

    <div id="resultado">

        Digite um ano.

    </div>

</div>

<script>

async function buscarNomes(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    // descobrir década
    const decada =
        Math.floor(ano / 10) * 10;

    resultado.innerHTML =
        "Buscando tabela completa...";

    try{

        // API MAIS COMPLETA
        const url =

`https://servicodados.ibge.gov.br/api/v1/censos/nomes/ranking?qtd=25&decada=${decada}`;

        const resposta =
            await fetch(url);

        if(!resposta.ok){

            throw new Error(
                "Erro na API"
            );
        }

        const dados =
            await resposta.json();

        if(
            !dados ||
            !dados[0] ||
            !dados[0].res
        ){

            resultado.innerHTML =
                "Nenhum resultado.";

            return;
        }

        const nomes =
            dados[0].res;

        let html = `

            <h2>
                Década de ${decada}
            </h2>

            <p>
                ${nomes.length} nomes encontrados
            </p>

            <table>

                <tr>

                    <th>#</th>
                    <th>Nome</th>
                    <th>Frequência</th>

                </tr>

        `;

        nomes.forEach((item, index) => {

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${item.nome}
                    </td>

                    <td>
                        ${item.frequencia.toLocaleString()}
                    </td>

                </tr>

            `;

        });

        html += "</table>";

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        resultado.innerHTML =

            "Erro ao buscar tabela.";

    }

}

</script>

</body>
</html>
