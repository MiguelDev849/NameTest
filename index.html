<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesquisa de Nomes IBGE</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{
    width:900px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;
}

input{

    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    box-sizing:border-box;

    margin-top:10px;
}

button{

    width:100%;
    margin-top:10px;

    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    cursor:pointer;
}

#resultado{

    margin-top:20px;

    background:#181818;

    border-radius:10px;

    padding:15px;

    max-height:600px;
    overflow-y:auto;
}

.nome{
    padding:10px;
    border-bottom:1px solid #333;
}

.info{
    color:#aaa;
}

</style>

</head>
<body>

<div class="box">

    <h1>Pesquisa de Nomes do IBGE</h1>

    <!-- PESQUISA POR ANO -->
    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscarPorAno()">
        Buscar por ano
    </button>

    <br><br>

    <!-- PESQUISA POR NOME -->
    <input
        type="text"
        id="nome"
        placeholder="Digite um nome"
    >

    <button onclick="buscarPorNome()">
        Buscar nome específico
    </button>

    <div id="resultado">

        Faça uma pesquisa.

    </div>

</div>

<script>

const resultado =
    document.getElementById("resultado");

// ============================
// BUSCAR POR ANO
// ============================

async function buscarPorAno(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    const decada =
        Math.floor(ano / 10) * 10;

    resultado.innerHTML =
        "Buscando nomes...";

    try{

        const url =

`https://servicodados.ibge.gov.br/api/v1/censos/nomes/ranking?qtd=1000&decada=${decada}`;

        const resposta =
            await fetch(url);

        const dados =
            await resposta.json();

        const nomes =
            dados[0].res;

        let html = `

            <h2>
                Década de ${decada}
            </h2>

            <p>
                ${nomes.length} nomes encontrados
            </p>

        `;

        nomes.forEach((item, index) => {

            html += `

                <div class="nome">

                    <b>
                        ${index + 1}.
                        ${item.nome}
                    </b>

                    <div class="info">

                        Frequência:
                        ${item.frequencia.toLocaleString()}

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        resultado.innerHTML =
            "Erro ao buscar nomes.";
    }
}

// ============================
// BUSCAR POR NOME
// ============================

async function buscarPorNome(){

    const nome =
        document
        .getElementById("nome")
        .value
        .trim();

    if(!nome){

        resultado.innerHTML =
            "Digite um nome.";

        return;
    }

    resultado.innerHTML =
        "Buscando nome...";

    try{

        const url =

`https://servicodados.ibge.gov.br/api/v2/censos/nomes/${nome}`;

        const resposta =
            await fetch(url);

        const dados =
            await resposta.json();

        if(!dados[0]){

            resultado.innerHTML =
                "Nome não encontrado.";

            return;
        }

        const info =
            dados[0];

        let html = `

            <h2>
                ${info.nome}
            </h2>

            <p>
                Total:
                ${info.frequencia.toLocaleString()}
            </p>

            <h3>
                Frequência por década
            </h3>

        `;

        info.res.forEach((item) => {

            html += `

                <div class="nome">

                    <b>
                        ${item.periodo}
                    </b>

                    <div class="info">

                        ${item.frequencia.toLocaleString()}
                        pessoas

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        resultado.innerHTML =
            "Erro ao buscar nome.";
    }
}

</script>

</body>
</html>
