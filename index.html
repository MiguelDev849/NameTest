<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Banco de Nomes</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.box{

    width:900px;

    background:#1f1f1f;

    padding:25px;
    border-radius:20px;
}

input{

    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    box-sizing:border-box;
}

button{

    width:100%;
    margin-top:10px;

    padding:12px;

    border:none;
    border-radius:10px;

    background:#00aaff;
    color:white;

    cursor:pointer;
}

#resultado{

    margin-top:20px;

    background:#181818;

    border-radius:10px;

    padding:15px;

    max-height:600px;
    overflow-y:auto;
}

.nome{

    padding:10px;

    border-bottom:1px solid #333;
}

.info{
    color:#aaa;
}

</style>

</head>
<body>

<div class="box">

    <h1>Super Banco de Nomes</h1>

    <input
        type="number"
        id="ano"
        placeholder="Digite um ano"
    >

    <button onclick="buscar()">
        Buscar nomes
    </button>

    <div id="resultado">

        Digite um ano.

    </div>

</div>

<script>

// BANCO EXTRA GIGANTE
const nomesExtras = [

"Abel","Abigail","Abraão","Ada","Adalberto",
"Adalgisa","Adão","Adelaide","Ademar","Adriana",
"Agnaldo","Aída","Alan","Alana","Alberto",
"Albina","Alcides","Alda","Aldair","Aldaíra",
"Alejandro","Alessandra","Alex","Alexa","Alexandre",
"Alexia","Alice","Aline","Almir","Aloísio",
"Altair","Alzira","Amanda","Amélia","Ana",
"Anselmo","Antônio","Aparecida","Arlete","Armando",
"Arthur","Aurora","Bárbara","Beatriz","Benedito",
"Bianca","Brenda","Bruno","Caio","Camila",
"Carlos","Carolina","Cássia","Cecília","César",
"Cláudia","Cláudio","Cristiane","Cristiano","Daniel",
"Daniela","Davi","Denise","Diego","Douglas",
"Eduarda","Eduardo","Elaine","Eliana","Emanuel",
"Enzo","Erick","Esther","Evelyn","Fabiana",
"Felipe","Fernanda","Fernando","Francisco","Gabriel",
"Gabriela","Giovana","Gisele","Gustavo","Helena",
"Henrique","Hugo","Igor","Ingrid","Isabela",
"Isadora","Jéssica","João","Joaquim","Jonas",
"Jorge","José","Josefa","Joyce","Juan",
"Júlia","Juliana","Kaique","Karen","Kauã",
"Kelly","Kevin","Lara","Larissa","Laura",
"Leonardo","Letícia","Lívia","Lorena","Lucas",
"Luciana","Luiz","Luna","Marcelo","Márcia",
"Marcos","Maria","Mariana","Matheus","Melissa",
"Miguel","Milena","Natália","Nicole","Nicolas",
"Noah","Olívia","Otávio","Patrícia","Paulo",
"Pedro","Priscila","Rafael","Raquel","Rebecca",
"Renata","Renato","Ricardo","Roberto","Rodrigo",
"Sabrina","Samuel","Sandra","Sara","Sophia",
"Stefany","Tainá","Talita","Theo","Thiago",
"Valentina","Vanessa","Vicente","Vinicius","Vitória",
"Wagner","Wallace","Wellington","William","Yasmin"

];

async function buscar(){

    const ano =
        Number(
            document.getElementById("ano").value
        );

    const resultado =
        document.getElementById("resultado");

    if(!ano){

        resultado.innerHTML =
            "Digite um ano válido.";

        return;
    }

    const decada =
        Math.floor(ano / 10) * 10;

    resultado.innerHTML =
        "Buscando nomes...";

    try{

        // API DO IBGE
        const url =

`https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking?decada=${decada}`;

        const resposta =
            await fetch(url);

        const dados =
            await resposta.json();

        let nomesIBGE = [];

        // pegar nomes da API
        if(
            dados &&
            dados[0] &&
            dados[0].res
        ){

            nomesIBGE =
                dados[0].res.map(
                    x => x.nome
                );
        }

        // juntar listas
        const nomesFinal = [

            ...nomesIBGE,
            ...nomesExtras

        ];

        // remover repetidos
        const semDuplicados = [

            ...new Set(nomesFinal)

        ];

        let html = `

            <h2>
                Década de ${decada}
            </h2>

            <p>
                ${semDuplicados.length}
                nomes encontrados
            </p>

        `;

        semDuplicados.forEach((nome, index) => {

            let sexo =
                nome.endsWith("a")
                ? "Feminino"
                : "Masculino";

            html += `

                <div class="nome">

                    <b>
                        ${index + 1}.
                        ${nome}
                    </b>

                    <div class="info">

                        Sexo provável:
                        ${sexo}

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;

    }catch(erro){

        console.error(erro);

        // fallback sem API
        let html = `

            <h2>
                Banco local
            </h2>

            <p>
                ${nomesExtras.length}
                nomes encontrados
            </p>

        `;

        nomesExtras.forEach((nome, index) => {

            let sexo =
                nome.endsWith("a")
                ? "Feminino"
                : "Masculino";

            html += `

                <div class="nome">

                    <b>
                        ${index + 1}.
                        ${nome}
                    </b>

                    <div class="info">

                        Sexo provável:
                        ${sexo}

                    </div>

                </div>

            `;

        });

        resultado.innerHTML = html;
    }
}

</script>

</body>
</html>
